name: Welldium Feed Updater

on:
  schedule:
    # 2x per dag (06:00 en 18:00 UTC) voor prijs + voorraad van bestaande producten.
    - cron: "0 6,18 * * *"
  workflow_dispatch:

# De bot moet de bijgewerkte XML kunnen terugpushen naar de repo.
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Scraper draaien
        run: python scraper.py

      # Apex Energetics: eigen bestand + eigen Stock Sync-feed (tijdelijke bron sinds
      # Deltastar Apex op 24-09-2026 schrapte). Draait ook als de stap hierboven faalt;
      # de rem in controleer_omvang laat bij een halve uitkomst de vorige feed staan.
      - name: Scraper draaien (Apex Energetics)
        if: ${{ !cancelled() }}
        env:
          WELLDIUM_BRANDS: "Apex Energetics"
          OUTPUT_FILE: welldium_apex_feed.xml
        run: python scraper.py

      - name: XML committen en pushen
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add welldium_feed.xml welldium_apex_feed.xml
          git diff --staged --quiet || git commit -m "🔄 Feed bijgewerkt: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
